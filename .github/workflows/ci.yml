name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Backend tests
        run: dotnet test Lynx.sln -c Release --nologo

      - name: Frontend build
        working-directory: web/lynx-web
        run: |
          npm ci --no-audit --no-fund
          npm run build
